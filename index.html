<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的游戏库</title>
    <style>
        body { text-align: center; margin-top: 100px; font-family: sans-serif; background-color: #f4f4f9; }
        h1 { color: #333; }
        .btn {
            display: inline-block;
            margin: 20px;
            padding: 15px 30px;
            font-size: 20px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-old { background-color: #007bff; }
        .btn-old:hover { background-color: #0056b3; }
        .btn-new { background-color: #28a745; }
        .btn-new:hover { background-color: #1e7e34; }
    </style>
</head>
<body>
    <h1>欢迎来到我的游戏库</h1>
    <p>请选择你要玩的游戏：</p>
    <a href="linespace/" class="btn btn-old">🎮 玩旧游戏 (Line/Space)</a>
    <a href="spacegame/" class="btn btn-new">🚀 玩新游戏 (Spacegame)</a>
</body>
</html>
